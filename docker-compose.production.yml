services:
  postgres:
    image: postgres:16-alpine
    container_name: quantforge-prod-postgres
    env_file:
      - .env.production
    ports:
      - "5432:5432"
    volumes:
      - quantforge_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: quantforge-prod-redis
    ports:
      - "6379:6379"
    volumes:
      - quantforge_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dashboard-api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: quantforge-dashboard-api
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    volumes:
      - quantforge_prod_parquet:/app/var/parquet
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  dashboard-web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: quantforge-dashboard-web
    ports:
      - "5175:80"
    depends_on:
      dashboard-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  quantforge_prod_postgres_data:
  quantforge_prod_redis_data:
  quantforge_prod_parquet:
