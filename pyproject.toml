[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge-ai"
version = "0.1.0"
description = "AI-powered quantitative Forex strategy discovery, validation, and automated trading platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "numpy>=1.26",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyarrow>=15.0",
    "redis>=5.0",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.5",
    "pytest-cov>=5.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/quantforge/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
